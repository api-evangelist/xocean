aid: xocean
name: XOCEAN
description: 'XOCEAN is an Irish ocean-data company, founded in 2017 and headquartered at the
  Rathcor Technical Centre in Co. Louth, Ireland, with offices in the UK, US, Canada, Norway and
  Australia and over 240 staff. It collects turnkey marine data using a fleet of low-carbon
  Uncrewed Surface Vessels (USVs) piloted over satellite from onshore operations centres, carrying
  multibeam echosounder, sub-bottom profiler, side-scan sonar, magnetometer and USBL payloads for
  seabed mapping, geophysical survey and environmental monitoring. Its customers are offshore wind
  developers, subsea cable operators, national hydrographic offices, oil and gas operators and
  carbon capture and storage projects, and its proprietary CyberDeck cloud environment monitors and
  controls the fleet in real time. XOCEAN sells survey data as a service — project deliverables,
  not a programmable product — and publishes no public API, developer portal, SDK or
  machine-readable contract of any kind.'
