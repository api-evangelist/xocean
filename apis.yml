    programmable product — xocean.com is a 22-page WordPress marketing site with no /developers,
    /api or /docs section, api./docs./developer.xocean.com do not exist in DNS, there is no xocean
    GitHub organization, and the only machine-readable surface on the domain is the CMS's own
    stock /wp-json/ REST root; the CyberDeck cloud platform named on the technology page is the
    internal console XOCEAN's own pilots use to fly the USVs, not a customer-facing API.
