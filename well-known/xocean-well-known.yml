x-contract-discovery:
  note: >-
    STEP 0b contract discovery, run 2026-09-04. No OpenAPI, Swagger, GraphQL, AsyncAPI, MCP,
    A2A agent card, gRPC or WSDL surface exists on any host XOCEAN controls. The one
    machine-readable surface found is the stock WordPress REST API at https://xocean.com/wp-json/
    (HTTP 200, 407 routes across 23 namespaces — wp/v2, elementor/v1, wp-smush/v1, complianz/v1,
    google-site-kit/v1 and similar CMS plugin namespaces). It is the default REST layer of the
    marketing site's CMS, not a product XOCEAN publishes, documents or supports, so it is recorded
    here as a finding and deliberately NOT registered as an API entry or wired to a contract
    pointer — doing so would credit XOCEAN with an API it never shipped.
  probes:
  - url: https://xocean.com/openapi.json
    status: 404
